name: CI

on:
    push:
        branches:
            - main
            - master
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: Rust and JavaScript checks
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2

            - name: Install Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Install Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Run CI
              run: bash scripts/ci.sh
